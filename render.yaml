services:
  # 1. Database (Private Service)
  - type: pserv
    name: paywallet-mysql
    env: image
    image:
      url: mysql:8
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 1
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
      - key: MYSQL_DATABASE
        value: paywallet

  # 2. Backend (Web Service)
  - type: web
    name: paywallet-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DB_URL
        value: jdbc:mysql://paywallet-mysql:3306/paywallet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - key: DB_USERNAME
        value: root
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: paywallet-mysql
          envVarKey: MYSQL_ROOT_PASSWORD
      - key: JWT_SECRET
        generateValue: true
      # Secrets (sync: false means you will input them manually in the Render dashboard)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

  # 3. Frontend (Static Site)
  - type: web
    name: paywallet-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_RAZORPAY_KEY_ID
        sync: false
      - key: VITE_API_BASE_URL
        # Note: Render may assign a slightly different URL depending on availability.
        # You can update this in the Render dashboard if the backend URL is different.
        value: https://paywallet-backend.onrender.com/api/v1

