services:
  # AkhhaPAY Banking Application (Spring Boot API + Executive Thymeleaf UI)
  - type: web
    name: akkhapay-app
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/auth/health
    envVars:
      # Database Connection (Connect to any MySQL instance e.g., TiDB Cloud Serverless, Aiven, or Remote MySQL)
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      # Security & JWT
      - key: JWT_SECRET
        generateValue: true

      # Razorpay Gateway Test Mode
      - key: RAZORPAY_KEY_ID
        value: rzp_test_TGEgZXObLrLXH4
      - key: RAZORPAY_KEY_SECRET
        value: QHTdjJxQ4sxRIjaVB0BW6Dt3

      # Gmail SMTP 2FA OTP & Transaction Alerts
      - key: MAIL_USERNAME
        value: titumaalo@gmail.com
      - key: MAIL_PASSWORD
        value: udjs lhjw qojs danl

      # Twilio SMS (Optional fallback)
      - key: TWILIO_ACCOUNT_SID
        value: AC_TWILIO_ACCOUNT_SID_PLACEHOLDER
      - key: TWILIO_AUTH_TOKEN
        value: TWILIO_AUTH_TOKEN_PLACEHOLDER
      - key: TWILIO_PHONE_NUMBER
        value: "+14472677886"
