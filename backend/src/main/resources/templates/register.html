<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — AkhhaPAY Corporate</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0e14] text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-amber-600 selection:text-white">

  <div class="w-full max-w-md">
    <!-- Executive Card -->
    <div class="bg-[#121620] border border-[#222a3a] rounded-3xl p-8 sm:p-10 shadow-2xl relative">
      <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-amber-600/70 to-transparent"></div>

      <!-- Brand Emblem -->
      <div class="flex flex-col items-center mb-8">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-amber-600 to-amber-700 flex items-center justify-center mb-3.5 text-slate-950 font-black text-xl shadow-md">
          AP
        </div>
        <h1 class="text-2xl font-black text-white tracking-tight">Create Wallet</h1>
        <p class="mt-1 text-[11px] uppercase tracking-widest text-slate-400 font-bold">
          AkhhaPAY Institutional Banking
        </p>
      </div>

      <!-- Alert message -->
      <div id="regError" class="hidden mb-5 p-3.5 rounded-xl bg-[#281318] border border-rose-500/30 text-rose-300 text-xs font-semibold flex items-center gap-2.5">
        <span>⚠️</span>
        <span id="regErrorText">Error message</span>
      </div>

      <form id="registerForm" onsubmit="handleRegisterSubmit(event)" class="space-y-4">
        <!-- Full Name -->
        <div class="space-y-1.5">
          <label for="fullName" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">
            Full Legal Name
          </label>
          <input
            id="fullName"
            type="text"
            required
            placeholder="Mohammad Anas"
            class="w-full bg-[#0a0d14] border border-[#222a3a] rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-amber-600/70 transition-colors"
          />
        </div>

        <!-- Email -->
        <div class="space-y-1.5">
          <label for="email" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">
            Email Address (for Gmail OTP &amp; Alerts)
          </label>
          <input
            id="email"
            type="email"
            required
            placeholder="yourname@gmail.com"
            class="w-full bg-[#0a0d14] border border-[#222a3a] rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-amber-600/70 transition-colors"
          />
        </div>

        <!-- Phone -->
        <div class="space-y-1.5">
          <label for="phone" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">
            Phone Number
          </label>
          <input
            id="phone"
            type="tel"
            required
            placeholder="+919876543210"
            class="w-full bg-[#0a0d14] border border-[#222a3a] rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-amber-600/70 transition-colors"
          />
        </div>

        <!-- Password -->
        <div class="space-y-1.5">
          <label for="password" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">
            Password (min 8 characters)
          </label>
          <input
            id="password"
            type="password"
            required
            minlength="8"
            placeholder="••••••••••••"
            class="w-full bg-[#0a0d14] border border-[#222a3a] rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-amber-600/70 transition-colors"
          />
        </div>

        <button
          id="regSubmitBtn"
          type="submit"
          class="w-full bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-500 hover:to-amber-600 text-slate-950 font-bold text-sm py-3.5 rounded-xl transition-all flex items-center justify-center gap-2 shadow-sm mt-2"
        >
          <span>Open Account &amp; Proceed to Login</span>
        </button>
      </form>

      <div class="mt-8 text-center">
        <p class="text-xs text-slate-400">
          Already registered?
          <a href="/login" class="text-amber-400 font-semibold hover:underline">
            Sign In here
          </a>
        </p>
      </div>
    </div>
  </div>

  <script>
    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('regError');
      const errorText = document.getElementById('regErrorText');
      const submitBtn = document.getElementById('regSubmitBtn');

      errorEl.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Creating Account...</span>';

      try {
        const res = await fetch('/api/v1/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fullName, email, phone, password })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.message || 'Registration failed');
        }

        window.location.href = '/login?registered=true';
      } catch (err) {
        errorText.textContent = err.message || 'Registration failed. Check details.';
        errorEl.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Open Account &amp; Proceed to Login</span>';
      }
    }
  </script>
</body>
</html>
