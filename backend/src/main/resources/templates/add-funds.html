<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deposit Funds — AkhhaPAY Corporate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Razorpay Checkout Script -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="bg-[#0b0e14] text-slate-100 min-h-screen antialiased selection:bg-amber-600 selection:text-white">

  <!-- Include Shared Navigation Header & Drawer -->
  <div th:replace="~{fragments/navbar :: header('add-funds')}"></div>

  <main class="max-w-4xl mx-auto px-4 sm:px-6 py-8 space-y-6">

    <!-- Header -->
    <div>
      <span class="text-xs uppercase tracking-widest text-amber-500 font-bold block mb-1">
        Liquidity Gateway
      </span>
      <h1 class="text-2xl sm:text-3xl font-black text-white tracking-tight">
        Add Funds
      </h1>
      <p class="text-xs sm:text-sm text-slate-400 mt-1">
        Deposit INR into your wallet via Razorpay Secure Gateway (Cards, Netbanking, UPI, Wallets).
      </p>
    </div>

    <!-- Deposit Card -->
    <div class="bg-[#121620] border border-[#222a3a] rounded-3xl p-7 sm:p-9 shadow-xl max-w-xl">
      <div class="flex items-center justify-between mb-6 pb-4 border-b border-[#1c2434]">
        <div>
          <h3 class="text-sm font-bold text-white">Razorpay Instant Deposit</h3>
          <p class="text-[11px] text-slate-400 mt-0.5">Encrypted 256-bit automated transaction processing.</p>
        </div>
        <span class="text-xs px-2.5 py-1 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 font-bold">
          Instant Credit
        </span>
      </div>

      <form id="addFundsForm" onsubmit="handleAddFunds(event)" class="space-y-6">
        <!-- Quick Amount Chips -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
            Quick Amount Presets
          </label>
          <div class="grid grid-cols-4 gap-2">
            <button type="button" onclick="setPreset(500)" class="py-2.5 rounded-xl bg-[#0a0d14] hover:bg-[#182030] border border-[#222a3a] text-xs font-mono font-bold text-slate-300 hover:text-white transition-colors">
              ₹500
            </button>
            <button type="button" onclick="setPreset(1000)" class="py-2.5 rounded-xl bg-[#0a0d14] hover:bg-[#182030] border border-[#222a3a] text-xs font-mono font-bold text-slate-300 hover:text-white transition-colors">
              ₹1,000
            </button>
            <button type="button" onclick="setPreset(5000)" class="py-2.5 rounded-xl bg-[#0a0d14] hover:bg-[#182030] border border-[#222a3a] text-xs font-mono font-bold text-slate-300 hover:text-white transition-colors">
              ₹5,000
            </button>
            <button type="button" onclick="setPreset(10000)" class="py-2.5 rounded-xl bg-[#0a0d14] hover:bg-[#182030] border border-[#222a3a] text-xs font-mono font-bold text-slate-300 hover:text-white transition-colors">
              ₹10,000
            </button>
          </div>
        </div>

        <!-- Custom Amount -->
        <div class="space-y-1.5">
          <label for="depositAmount" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">
            Deposit Amount (INR)
          </label>
          <div class="relative">
            <span class="absolute left-4 top-3.5 text-slate-400 font-bold text-sm">₹</span>
            <input
              id="depositAmount"
              type="number"
              min="1"
              step="0.01"
              required
              placeholder="0.00"
              class="w-full bg-[#0a0d14] border border-[#222a3a] focus:border-amber-500 rounded-xl pl-8 pr-4 py-3.5 text-base font-mono font-bold text-white placeholder-slate-600 focus:outline-none"
            />
          </div>
          <p class="text-[11px] text-slate-500">Minimum deposit ₹1.00. No convenience fees applied.</p>
        </div>

        <button
          id="payBtn"
          type="submit"
          class="w-full bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-500 hover:to-amber-600 text-slate-950 font-bold text-sm py-3.5 rounded-xl transition-all flex items-center justify-center gap-2 shadow-sm"
        >
          <span>Open Razorpay Payment Checkout →</span>
        </button>

        <!-- Instant Test Deposit Simulator Option -->
        <div class="pt-2 border-t border-[#1c2434] text-center">
          <button
            type="button"
            onclick="handleInstantTestDeposit()"
            class="text-xs text-amber-400 hover:text-amber-300 transition-colors font-semibold"
          >
            ⚡ Or 1-Click Instant Deposit (Test Simulation)
          </button>
        </div>
      </form>
    </div>

  </main>

  <script th:inline="javascript">
    const razorpayKey = /*[[${razorpayKeyId}]]*/ 'rzp_test_TGEgZXObLrLXH4';

    function setPreset(amt) {
      document.getElementById('depositAmount').value = amt;
    }

    async function handleAddFunds(e) {
      e.preventDefault();
      const amount = Number(document.getElementById('depositAmount').value);
      const btn = document.getElementById('payBtn');

      if (!amount || amount < 1) {
        showToast('error', 'Please enter a valid amount.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span>Creating Payment Order...</span>';

      try {
        // Step 1: Create Order
        const res = await fetch('/api/v1/payments/create-order', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ userId: currentUser.id, amount: amount })
        });
        const orderData = await res.json();
        const orderId = orderData.orderId || orderData.id;

        if (!res.ok || !orderId) {
          throw new Error(orderData.message || 'Order creation failed.');
        }

        // Step 2: Open Razorpay
        const options = {
          key: razorpayKey,
          amount: orderData.amountInPaise || (amount * 100),
          currency: 'INR',
          name: 'AkhhaPAY Digital Wallet',
          description: 'Wallet Account Balance Top-up',
          order_id: orderId,
          prefill: {
            email: currentUser.email,
          },
          theme: {
            color: '#d97706'
          },
          handler: async function (response) {
            btn.innerHTML = '<span>Verifying Payment Signature...</span>';

            // Step 3: Verify Payment
            try {
              const verifyRes = await fetch('/api/v1/payments/verify', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({
                  orderId: response.razorpay_order_id,
                  paymentId: response.razorpay_payment_id,
                  signature: response.razorpay_signature,
                  userId: currentUser.id,
                  amount: amount
                })
              });
              const verifyData = await verifyRes.json();

              if (!verifyRes.ok) {
                throw new Error(verifyData.message || 'Verification failed');
              }

              showToast('success', 'Funds successfully deposited to wallet!');
              setTimeout(() => window.location.href = '/dashboard', 1200);
            } catch (vErr) {
              showToast('error', vErr.message);
              btn.disabled = false;
              btn.innerHTML = '<span>Open Razorpay Payment Checkout →</span>';
            }
          },
          modal: {
            ondismiss: function () {
              btn.disabled = false;
              btn.innerHTML = '<span>Open Razorpay Payment Checkout →</span>';
            }
          }
        };

        const rzp = new Razorpay(options);
        rzp.open();

      } catch (err) {
        showToast('error', err.message);
        btn.disabled = false;
        btn.innerHTML = '<span>Open Razorpay Payment Checkout →</span>';
      }
    }

    // 1-Click Instant Test Deposit
    async function handleInstantTestDeposit() {
      const amount = Number(document.getElementById('depositAmount').value) || 500;
      try {
        const verifyRes = await fetch('/api/v1/payments/verify', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({
            orderId: 'order_test_' + Date.now(),
            paymentId: 'pay_test_' + Date.now(),
            signature: 'demo_test_signature',
            userId: currentUser.id,
            amount: amount
          })
        });
        const verifyData = await verifyRes.json();
        if (!verifyRes.ok) throw new Error(verifyData.message || 'Deposit simulation failed');

        showToast('success', '₹' + amount + ' deposited successfully via Test Simulation!');
        setTimeout(() => window.location.href = '/dashboard', 1200);
      } catch (err) {
        showToast('error', err.message);
      }
    }
  </script>
</body>
</html>
