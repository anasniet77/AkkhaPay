server:
  port: ${PORT:8080}

spring:
  application:
    name: paywallet

  # ── DataSource (MySQL + HikariCP) ──────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/banking_wallet?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Anas786}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      pool-name: PayWalletHikariPool
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  # ── JPA / Hibernate ────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # ── Flyway Migrations ──────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Gmail SMTP Configuration (OTP Engine) ──────────────────────────
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:titumaalo@gmail.com}
    password: ${MAIL_PASSWORD:udjs lhjw qojs danl}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# ── Cloud HTTP Mailer (Port 443 / Render-safe) ────────────────────────
resend:
  api:
    key: ${RESEND_API_KEY:}

# ── JWT Security ──────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:cGF5d2FsbGV0LWRldi1zZWNyZXQta2V5LXRoaXMtaXMtbm90LWZvci1wcm9kdWN0aW9uLXVzZS0yMDI2}
  expiration: 86400000  # 24 hours in milliseconds

# ── Razorpay Payment Gateway ──────────────────────────────────────────
