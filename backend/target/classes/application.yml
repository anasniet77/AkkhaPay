server:
  port: 8080

spring:
  application:
    name: paywallet

  # ── DataSource (MySQL + HikariCP) ──────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/paywallet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      pool-name: PayWalletHikariPool
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  # ── JPA / Hibernate ────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # ── Flyway ─────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# ── JWT ───────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:cGF5d2FsbGV0LWRldi1zZWNyZXQta2V5LXRoaXMtaXMtbm90LWZvci1wcm9kdWN0aW9uLXVzZS0yMDI2}
  expiration: 86400000  # 24 hours in milliseconds

# ── Razorpay ──────────────────────────────────────────────────────────
razorpay:
  key:
    id: ${RAZORPAY_KEY_ID}
    secret: ${RAZORPAY_KEY_SECRET}

# ── Twilio ────────────────────────────────────────────────────────────
twilio:
  account:
    sid: ${TWILIO_ACCOUNT_SID}
  auth:
    token: ${TWILIO_AUTH_TOKEN}
  phone:
    number: ${TWILIO_PHONE_NUMBER}
